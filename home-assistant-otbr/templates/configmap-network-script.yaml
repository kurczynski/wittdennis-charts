{{- if eq .Values.homeAssistantOtbr.rcpType "network" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-assistant-otbr.fullname" . }}-network-script
  labels:
    {{- include "home-assistant-otbr.labels" . | nindent 4 }}
data:
  dependency: ""
  run: |
    #!/usr/bin/with-contenv bash
    # vim: ft=bash
    # shellcheck shell=bash
    # ==============================================================================
    # OpenThread BorderRouter start script (Modified for Network RCP)
    # ==============================================================================

    # shellcheck disable=SC1091
    . /etc/s6-overlay/scripts/otbr-agent-common

    declare backbone_if
    declare device
    declare baudrate
    declare flow_control
    declare otbr_log_level
    declare otbr_log_level_int
    declare otbr_rest_listen
    declare otbr_rest_listen_port

    backbone_if=$BACKBONE_IF
    device=$DEVICE
    network_device_env=$NETWORK_DEVICE

    baudrate=$BAUDRATE
    flow_control=""

    if [ "$FLOW_CONTROL" == "1" ]; then
        flow_control="&uart-flow-control"
    else
        flow_control="&uart-init-deassert"
    fi

    otbr_log_level=${OTBR_LOG_LEVEL:-info}
    case "${otbr_log_level}" in
    debug)
        otbr_log_level_int="7"
        ;;
    info)
        otbr_log_level_int="6"
        ;;
    notice)
        otbr_log_level_int="5"
        ;;
    warning)
        otbr_log_level_int="4"
        ;;
    error)
        otbr_log_level_int="3"
        ;;
    critical)
        otbr_log_level_int="2"
        ;;
    alert)
        otbr_log_level_int="1"
        ;;
    emergency)
        otbr_log_level_int="0"
        ;;
    *)
        echo "WARN: Unknown otbr_log_level: ${otbr_log_level} using info"
        otbr_log_level_int="6"
        ;;
    esac

    # shellcheck disable=SC2086
    if [ -z ${backbone_if} ]; then
        echo "ERR: No primary network interface found. Please configure a backbone network interface."
        exit 1
    fi

    # shellcheck disable=SC2015
    mkdir -p /data/thread && ln -sft /var/lib /data/thread || echo "ERROR: Could not create directory /var/lib/thread to store Thread data."

    # We compile the OTBR with firewall support, so otbr-agent tries to update the
    # ipsets. Therefor, create ipsets always to avoid errors from otbr-agent. Just
    # the ipsets  won't have an effect in practice when the firewall is disabled.
    ipset create -exist otbr-ingress-deny-src hash:net family inet6 2>/dev/null || true
    ipset create -exist otbr-ingress-deny-src-swap hash:net family inet6 2>/dev/null || true
    ipset create -exist otbr-ingress-allow-dst hash:net family inet6 2>/dev/null || true
    ipset create -exist otbr-ingress-allow-dst-swap hash:net family inet6 2>/dev/null || true

    if [ "$FIREWALL" == "1" ]; then
        echo "INFO: Setup OTBR firewall..."
        # shellcheck disable=SC2086,SC2154
        ip6tables -N $otbr_forward_ingress_chain 2>/dev/null || true
        # shellcheck disable=SC2086,SC2154
        ip6tables -I FORWARD 1 -o $thread_if -j $otbr_forward_ingress_chain 2>/dev/null || true

        # shellcheck disable=SC2086
        ip6tables -A $otbr_forward_ingress_chain -m pkttype --pkt-type unicast -i ${thread_if} -j DROP 2>/dev/null || true
        # shellcheck disable=SC2086
        ip6tables -A $otbr_forward_ingress_chain -m set --match-set otbr-ingress-deny-src src -j DROP 2>/dev/null || true
        # shellcheck disable=SC2086
        ip6tables -A $otbr_forward_ingress_chain -m set --match-set otbr-ingress-allow-dst dst -j ACCEPT 2>/dev/null || true
        # shellcheck disable=SC2086
        ip6tables -A $otbr_forward_ingress_chain -m pkttype --pkt-type unicast -j DROP 2>/dev/null || true
        # shellcheck disable=SC2086
        ip6tables -A $otbr_forward_ingress_chain -j ACCEPT 2>/dev/null || true

        # shellcheck disable=SC2086,SC2154
        ip6tables -N $otbr_forward_egress_chain 2>/dev/null || true
        # shellcheck disable=SC2086
        ip6tables -I FORWARD 2 -i $thread_if -j $otbr_forward_egress_chain 2>/dev/null || true
        # shellcheck disable=SC2086
        ip6tables -A $otbr_forward_egress_chain -j ACCEPT 2>/dev/null || true
    else
        # Make sure ip6tables (as used by Docker) allow IP forwarding
        ip6tables -P FORWARD ACCEPT 2>/dev/null || true
        # HAOS 9.3 and earlier (for 9.4 accept is the default so this won't do anything)
        ip6tables-legacy -P FORWARD ACCEPT 2>/dev/null || true
    fi

    if [ "$NAT64" == "1" ]; then
        # shellcheck disable=SC2086
        iptables -t mangle -A PREROUTING -i ${thread_if} -j MARK --set-mark 0x1001 2>/dev/null || true
        iptables -t nat -A POSTROUTING -m mark --mark 0x1001 -j MASQUERADE 2>/dev/null || true
        # shellcheck disable=SC2086
        iptables -t filter -A FORWARD -o ${backbone_if} -j ACCEPT 2>/dev/null || true
        # shellcheck disable=SC2086
        iptables -t filter -A FORWARD -i ${backbone_if} -j ACCEPT 2>/dev/null || true
    fi

    otbr_rest_listen="::"
    otbr_rest_listen_port="${OTBR_REST_PORT:-8081}"

    # Store REST API listen information for check script
    echo "${otbr_rest_listen}" >/tmp/otbr-agent-rest-api
    echo "${otbr_rest_listen_port}" >>/tmp/otbr-agent-rest-api

    # Skip migration for network devices (SKIP_MIGRATION=1)
    if [ "$SKIP_MIGRATION" != "1" ]; then
        echo "INFO: Migrating OTBR settings if needed..."
        python3 /usr/local/bin/migrate_otbr_settings.py \
            --adapter "${device}" \
            --baudrate "${baudrate}" \
            --flow-control "${migrate_flow_control}" \
            --data-dir /data/thread/
    else
        echo "INFO: Skipping OTBR settings migration (network RCP mode)"
    fi

    echo "INFO: Starting otbr-agent with network RCP..."
    # Wait for socat to create the PTY
    while [ ! -e "${device}" ]; do
        echo "Waiting for ${device} to be created by socat..."
        sleep 1
    done
    echo "PTY ${device} is ready"

    # Give socat a moment to fully initialize the connection
    sleep 2

    # For network RCP via socat PTY, use simple spinel URL without baudrate parameter
    # The baudrate is set in socat itself
    # shellcheck disable=SC2086
    exec s6-notifyoncheck -d -s 300 -w 300 -n 0 stdbuf -oL \
        "/usr/sbin/otbr-agent" -I ${thread_if} -B "${backbone_if}" \
        --rest-listen-address "${otbr_rest_listen}" \
        -d${otbr_log_level_int} -v -s \
        "spinel+hdlc+uart://${device}" \
        "trel://${backbone_if}"
{{- end }}
