{{- if eq .Values.homeAssistantOtbr.rcpType "network" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-assistant-otbr.fullname" . }}-socat-script
  labels:
    {{- include "home-assistant-otbr.labels" . | nindent 4 }}
data:
  run: |
    #!/usr/bin/with-contenv bash
    # vim: ft=bash
    # shellcheck shell=bash
    # ==============================================================================
    # Start socat TCP client for OTBR agent daemon (Modified)
    # ==============================================================================

    declare network_device

    network_device=$NETWORK_DEVICE

    echo "INFO: Starting socat TCP client for network device: ${network_device}"
    echo "INFO: Creating PTY link at /tmp/ttyOTBR"

    # Use s6-notifyoncheck to properly handle service readiness
    # Create PTY with specific settings that work for spinel protocol
    exec s6-notifyoncheck -d -n 0 -s 300 -w 300 -c "test -e /tmp/ttyOTBR" \
        sh -c 'exec /usr/bin/socat -d -d -d -d -x -x pty,link=/tmp/ttyOTBR,rawer,user-late=root,group-late=root,mode=666 tcp:'"${network_device}"
{{- end }}
